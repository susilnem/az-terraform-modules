name: CI

on:
  push:
    branches:
      - main
      - develop
      - projects/*
  pull_request:
    branches:
      - main
      - develop
      - projects/*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre_commit_check:
    name: Pre-Commit Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: gruntwork-io/terragrunt-action@v3

      - name: Install TFLint
        uses: terraform-linters/setup-tflint@v6.3.0
        with:
          tflint_version: v0.63.1

      - uses: pre-commit/action@v3.0.1

  module_tests:
    name: Module Unit Tests (terraform test)
    runs-on: ubuntu-latest
    needs: pre_commit_check
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: gruntwork-io/terragrunt-action@v3

      - name: Run module tests
        run: |
          set -euo pipefail
          for module_dir in modules/*/; do
            echo "== ${module_dir} =="
            (cd "${module_dir}" && terraform init -backend=false -input=false && terraform test)
          done

  lint_and_format:
    name: Terragrunt Lint & Format
    runs-on: ubuntu-latest
    needs: pre_commit_check
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: gruntwork-io/terragrunt-action@v3

      - name: Terragrunt Format Check
        run: terragrunt hcl format --check
        working-directory: environments/local

  validate:
    name: Terragrunt Validate
    runs-on: ubuntu-latest
    needs: [pre_commit_check, lint_and_format, module_tests]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: gruntwork-io/terragrunt-action@v3

      - name: Terragrunt Validate
        run: terragrunt run --all -- validate
        working-directory: environments/local
        env:
          TG_LOCAL_BACKEND: "true"
